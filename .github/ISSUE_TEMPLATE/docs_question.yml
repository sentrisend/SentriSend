name: Docs or question
description: Ask a question or suggest a correction to the public documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Please do not include API keys, passwords, tokens, or other secrets.
  - type: input
    id: page
    attributes:
      label: Page or example, if relevant
      description: Link to the documentation page or example you are asking about.
  - type: textarea
    id: question-or-correction
    attributes:
      label: What would you like to ask or change?
    validations:
      required: true
